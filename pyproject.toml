[project]
name = "safetydance"
version = "0.5.0"
description = "A typesafe system for defining and composing steps."
authors = [{ name = "David Charboneau", email = "david@adadabase.com" }]
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://dcharbon.gitlab.io/safetydance"
Homepage = "https://gitlab.com/dcharbon/safetydance"
Repository = "https://gitlab.com/dcharbon/safetydance.git"
Changelog = "https://gitlab.com/dcharbon/safetydance/-/blob/main/CHANGELOG.rst"

[dependency-groups]
test = ["pytest>=8.3.5,<9", "pytest-cov>=6.1.0,<7", "packaging>=24", "docutils>=0.21", "pytest-randomly>=3.15"]
docs = ["jupyter-book>=2.1.7,<3", "ipykernel>=6", "sphinx>=8", "sphinx-rtd-theme>=3"]
typing = ["mypy>=1.18"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "typing" },
    "nox>=2025.2.9",
]

[tool.uv.build-backend]
source-include = ["CHANGELOG.rst", "tests/**", "scripts/**"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["safetydance"]
branch = true

[tool.coverage.report]
show_missing = true
