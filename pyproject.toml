[project]
name = "safetydance"
version = "0.3.2"
description = "A typesafe system for defining and composing steps."
authors = [{ name = "David Charboneau", email = "david@adadabase.com" }]
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/dcharbon/safetydance"
Repository = "https://github.com/dcharbon/safetydance.git"

[dependency-groups]
test = ["pytest>=8.3.5,<9", "pytest-cov>=6.1.0,<7"]
docs = ["jupyter-book>=1.0.4.post1,<2"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "nox>=2025.2.9",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
